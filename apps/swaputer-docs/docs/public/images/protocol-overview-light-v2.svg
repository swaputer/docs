<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" data-theme="light">
  <title id="title">Swaputer World architecture</title>
  <desc id="desc">A Uniswap v4 pool, Swaputer Hook, Kernel, and SVM form one World. The SVM hosts programs that own state and emit Events.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff7fc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff37c7"/>
      <stop offset="1" stop-color="#ff70d7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#491c40" flood-opacity=".08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff37c7"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#fffcfd"/>
  <circle cx="260" cy="250" r="300" fill="#ff37c7" opacity=".07"/>
  <rect x="72" y="70" width="1456" height="760" rx="28" fill="none" stroke="#eadfea" stroke-width="2"/>
  <text x="112" y="126" fill="#291226" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="650">One World</text>
  <text x="112" y="164" fill="#6f5d70" font-family="Inter, Arial, sans-serif" font-size="18">Liquidity, execution and application state share one immutable boundary.</text>

  <g filter="url(#shadow)">
    <rect x="112" y="250" width="300" height="176" rx="18" fill="url(#panel)" stroke="#eadfea"/>
    <text x="142" y="292" fill="#ff70d7" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="1.5">LIQUIDITY</text>
    <text x="142" y="342" fill="#291226" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="620">Uniswap v4 pool</text>
    <text x="142" y="382" fill="#6f5d70" font-family="Inter, Arial, sans-serif" font-size="18">ETH ⇄ World token</text>

    <rect x="492" y="250" width="284" height="176" rx="18" fill="url(#panel)" stroke="#eadfea"/>
    <text x="522" y="292" fill="#ff70d7" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="1.5">BOUNDARY</text>
    <text x="522" y="342" fill="#291226" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="620">Swaputer Hook</text>
    <text x="522" y="382" fill="#6f5d70" font-family="Inter, Arial, sans-serif" font-size="18">Executable buys enter</text>

    <rect x="856" y="250" width="252" height="176" rx="18" fill="url(#panel)" stroke="#eadfea"/>
    <text x="886" y="292" fill="#ff70d7" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="1.5">SETTLEMENT</text>
    <text x="886" y="342" fill="#291226" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="620">Kernel</text>
    <text x="886" y="382" fill="#6f5d70" font-family="Inter, Arial, sans-serif" font-size="18">Verify · meter · commit</text>

    <rect x="1188" y="250" width="292" height="176" rx="18" fill="url(#panel)" stroke="#ff37c7" stroke-opacity=".55"/>
    <text x="1218" y="292" fill="#ff70d7" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="1.5">EXECUTION</text>
    <text x="1218" y="342" fill="#291226" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="620">SVM</text>
    <text x="1218" y="382" fill="#6f5d70" font-family="Inter, Arial, sans-serif" font-size="18">Deterministic programs</text>
  </g>

  <path d="M412 338 H492" fill="none" stroke="url(#accent)" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M776 338 H856" fill="none" stroke="#bdaebc" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1108 338 H1188" fill="none" stroke="#bdaebc" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M1334 426 V512" fill="none" stroke="#bdaebc" stroke-width="3"/>
  <path d="M1334 512 H866 V566" fill="none" stroke="#bdaebc" stroke-width="3"/>
  <path d="M1334 512 V566" fill="none" stroke="#bdaebc" stroke-width="3"/>

  <rect x="756" y="566" width="220" height="128" rx="16" fill="#ffffff" stroke="#eadfea"/>
  <text x="786" y="610" fill="#291226" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="610">Programs</text>
  <text x="786" y="650" fill="#6f5d70" font-family="Inter, Arial, sans-serif" font-size="17">Immutable logic</text>

  <rect x="1020" y="566" width="220" height="128" rx="16" fill="#ffffff" stroke="#eadfea"/>
  <text x="1050" y="610" fill="#291226" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="610">State</text>
  <text x="1050" y="650" fill="#6f5d70" font-family="Inter, Arial, sans-serif" font-size="17">World-scoped</text>

  <rect x="1284" y="566" width="196" height="128" rx="16" fill="#ffffff" stroke="#eadfea"/>
  <text x="1314" y="610" fill="#291226" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="610">Events</text>
  <text x="1314" y="650" fill="#6f5d70" font-family="Inter, Arial, sans-serif" font-size="17">Ordered receipts</text>

  <path d="M1334 512 H1130 V566" fill="none" stroke="#bdaebc" stroke-width="3"/>
  <text x="112" y="762" fill="#7a6a7c" font-family="Inter, Arial, sans-serif" font-size="17">Identity: worldId · protocol version · component addresses · code hashes · fixed parameters</text>
</svg>
