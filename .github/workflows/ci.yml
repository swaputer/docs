name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Documentation build and drift checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out documentation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve pinned Protocol commit
        id: protocol
        shell: bash
        run: |
          set -euo pipefail
          protocol_ref="$(git ls-tree HEAD .deps/protocol | awk '{print $3}')"
          test "$protocol_ref" != ""
          printf 'sha=%s\n' "$protocol_ref" >> "$GITHUB_OUTPUT"

      - name: Check out pinned private Protocol dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: swaputer/protocol
          ref: ${{ steps.protocol.outputs.sha }}
          path: .deps/protocol
          ssh-key: ${{ secrets.PROTOCOL_DEPLOY_KEY }}
          persist-credentials: false

      - name: Resolve Protocol's pinned Tooling commit
        id: tooling
        shell: bash
        run: |
          set -euo pipefail
          tooling_ref="$(git -C .deps/protocol ls-tree HEAD .deps/tooling | awk '{print $3}')"
          test "$tooling_ref" != ""
          printf 'sha=%s\n' "$tooling_ref" >> "$GITHUB_OUTPUT"

      - name: Check out pinned private Tooling dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: swaputer/tooling
          ref: ${{ steps.tooling.outputs.sha }}
          path: .deps/protocol/.deps/tooling
          ssh-key: ${{ secrets.TOOLING_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Node.js 22.21.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.21.0
          cache: npm
          cache-dependency-path: apps/swaputer-docs/package-lock.json

      - name: Install documentation dependencies
        run: npm ci --prefix apps/swaputer-docs

      - name: Audit documentation dependencies
        run: npm audit --prefix apps/swaputer-docs --audit-level=high

      - name: Build documentation and verify source drift
        run: npm run build --prefix apps/swaputer-docs
